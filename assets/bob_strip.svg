<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="t d">
  <title id="t">Recorded Bob IDE session</title>
  <desc id="d">Blocked, red 408/408, two subagents, stale edit, wrong guess mcttse, tctom fix, balanced, commit 9ee1c3c, 3.74 Bobcoins.</desc>
  <rect width="1280" height="380" fill="#FEFEFE"/>
  <text x="48" y="40" font-family="Consolas, monospace" font-size="14" letter-spacing="0.08em" fill="#6B6B6B">IBM BOB IDE  |  ONE PROMPT  |  3.74 BOBCOINS  |  COMMIT 9EE1C3C</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="70" width="140" height="120" fill="#FEFEFE" stroke="#C8102E" stroke-width="2"/>
    <text x="64" y="100" font-family="Consolas, monospace" font-size="13" fill="#C8102E">01</text>
    <text x="64" y="140" font-size="20" font-weight="600" fill="#1E1E1E">Blocked</text>
    <text x="64" y="168" font-size="13" fill="#6B6B6B">no weigh</text>

    <rect x="204" y="70" width="140" height="120" fill="#FEFEFE" stroke="#C8102E" stroke-width="2"/>
    <text x="220" y="100" font-family="Consolas, monospace" font-size="13" fill="#C8102E">02</text>
    <text x="220" y="140" font-size="20" font-weight="600" fill="#C8102E">Red</text>
    <text x="220" y="168" font-size="13" fill="#6B6B6B">408 of 408</text>

    <rect x="360" y="70" width="160" height="120" fill="#F3F3F3" stroke="#1E1E1E" stroke-width="1.5"/>
    <text x="376" y="100" font-family="Consolas, monospace" font-size="13" fill="#6B6B6B">03</text>
    <text x="376" y="140" font-size="18" font-weight="600" fill="#1E1E1E">2 subagents</text>
    <text x="376" y="168" font-size="13" fill="#6B6B6B">fees + totals</text>

    <rect x="536" y="70" width="150" height="120" fill="#FEFEFE" stroke="#C8102E" stroke-width="2"/>
    <text x="552" y="100" font-family="Consolas, monospace" font-size="13" fill="#C8102E">04</text>
    <text x="552" y="140" font-size="18" font-weight="600" fill="#1E1E1E">Stale edit</text>
    <text x="552" y="168" font-size="13" fill="#6B6B6B">blocked again</text>

    <rect x="702" y="70" width="170" height="120" fill="#FEFEFE" stroke="#C8102E" stroke-width="2"/>
    <text x="718" y="100" font-family="Consolas, monospace" font-size="13" fill="#C8102E">05</text>
    <text x="718" y="136" font-size="17" font-weight="600" fill="#1E1E1E">Wrong guess</text>
    <text x="718" y="160" font-size="13" fill="#6B6B6B">mcttse</text>
    <text x="718" y="180" font-size="13" fill="#C8102E">296 still differ</text>

    <rect x="888" y="70" width="150" height="120" fill="#F3F3F3" stroke="#1E1E1E" stroke-width="1.5"/>
    <text x="904" y="100" font-family="Consolas, monospace" font-size="13" fill="#6B6B6B">06</text>
    <text x="904" y="140" font-size="20" font-weight="600" fill="#1E1E1E">tctom</text>
    <text x="904" y="168" font-size="13" fill="#6B6B6B">explain + fix</text>

    <rect x="1054" y="70" width="178" height="120" fill="#1E1E1E"/>
    <text x="1070" y="100" font-family="Consolas, monospace" font-size="13" fill="#8FCB8F">07</text>
    <text x="1070" y="140" font-size="20" font-weight="600" fill="#FEFEFE">Balanced</text>
    <text x="1070" y="168" font-size="13" fill="#B0B0B0">408 of 408</text>
