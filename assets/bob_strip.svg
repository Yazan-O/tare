  <line x1="48" y1="230" x2="1232" y2="230" stroke="#DEDEDE" stroke-width="1"/>
  <text x="48" y="270" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#1E1E1E">Commit 9ee1c3c went through. Cost: 3.74 Bobcoins.</text>
  <text x="48" y="310" font-family="Consolas, monospace" font-size="15" fill="#6B6B6B">Stills from the recorded session live in bob_sessions/ (linked below).</text>
  <text x="48" y="350" font-family="Consolas, monospace" font-size="15" fill="#6B6B6B">Bob guessed wrong once. The old program held the door until the real line.</text>
</svg>
