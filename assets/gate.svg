<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="t d">
  <title id="t">Gate states</title>
  <desc id="d">No weigh, red, stale edit, and balanced - what the PreToolUse hook does in each state.</desc>
  <rect width="1280" height="540" fill="#FEFEFE"/>
  <text x="48" y="48" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="0.12em" fill="#6B6B6B">THE GATE</text>
  <text x="48" y="96" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1E1E1E">Four states. Only one lets the commit through.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="148" width="278" height="300" fill="#FEFEFE" stroke="#C8102E" stroke-width="3"/>
    <text x="72" y="196" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="0.08em" fill="#C8102E">BLOCK</text>
    <text x="72" y="252" font-size="30" font-weight="700" fill="#1E1E1E">No weigh</text>
    <text x="72" y="298" font-size="17" fill="#6B6B6B">No ledger on record</text>
    <text x="72" y="326" font-size="17" fill="#6B6B6B">for the case touched.</text>
    <text x="72" y="384" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#C8102E">hook exit 2</text>
    <text x="72" y="416" font-size="15" fill="#6B6B6B">No weigh on record</text>

    <rect x="350" y="148" width="278" height="300" fill="#FEFEFE" stroke="#C8102E" stroke-width="3"/>
    <text x="374" y="196" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="0.08em" fill="#C8102E">BLOCK</text>
    <text x="374" y="252" font-size="30" font-weight="700" fill="#1E1E1E">Red</text>
    <text x="374" y="298" font-size="17" fill="#6B6B6B">Last weigh found</text>
    <text x="374" y="326" font-size="17" fill="#6B6B6B">differing records.</text>
    <text x="374" y="384" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#C8102E">hook exit 2</text>
    <text x="374" y="416" font-size="15" fill="#6B6B6B">e.g. 408 of 408</text>

    <rect x="652" y="148" width="278" height="300" fill="#FEFEFE" stroke="#C8102E" stroke-width="3"/>
    <text x="676" y="196" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="0.08em" fill="#C8102E">BLOCK</text>
    <text x="676" y="252" font-size="30" font-weight="700" fill="#1E1E1E">Stale edit</text>
    <text x="676" y="298" font-size="17" fill="#6B6B6B">Port changed after</text>
    <text x="676" y="326" font-size="17" fill="#6B6B6B">the last weigh.</text>
    <text x="676" y="384" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#C8102E">hook exit 2</text>
    <text x="676" y="416" font-size="15" fill="#6B6B6B">Weigh it again</text>

    <rect x="954" y="148" width="278" height="300" fill="#1E1E1E"/>
    <text x="978" y="196" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="0.08em" fill="#FEFEFE">ALLOW</text>
    <text x="978" y="252" font-size="30" font-weight="700" fill="#FEFEFE">Balanced</text>
    <text x="978" y="298" font-size="17" fill="#B0B0B0">Every record matches</text>
    <text x="978" y="326" font-size="17" fill="#B0B0B0">and sources unchanged.</text>
    <text x="978" y="384" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#FEFEFE">hook exit 0</text>
    <text x="978" y="416" font-size="15" fill="#B0B0B0">Commit may proceed</text>
  </g>
  <text x="48" y="500" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6B6B6B">Also blocked: recorded-output only when sources differ from HEAD  |  protected paths dirty  |  every case the commit touches</text>
</svg>
