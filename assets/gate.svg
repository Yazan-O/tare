<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d">
  <title id="t">Gate states</title>
  <desc id="d">No weigh, red, stale edit, and balanced - what the PreToolUse hook does in each state.</desc>
  <rect width="1280" height="520" fill="#FEFEFE"/>
  <text x="48" y="48" font-family="Consolas, monospace" font-size="16" letter-spacing="0.1em" fill="#6B6B6B">THE GATE</text>
  <text x="48" y="90" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#1E1E1E">Four states. Only one lets the commit through.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="140" width="280" height="280" fill="#FEFEFE" stroke="#C8102E" stroke-width="2"/>
    <text x="68" y="180" font-family="Consolas, monospace" font-size="14" fill="#C8102E">BLOCK</text>
    <text x="68" y="230" font-size="26" font-weight="600" fill="#1E1E1E">No weigh</text>
    <text x="68" y="270" font-size="16" fill="#6B6B6B">No ledger on record</text>
    <text x="68" y="296" font-size="16" fill="#6B6B6B">for the case touched.</text>
    <text x="68" y="350" font-family="Consolas, monospace" font-size="15" fill="#C8102E">hook exit 2</text>
    <text x="68" y="382" font-size="15" fill="#6B6B6B">-No weigh on record-</text>

    <rect x="356" y="140" width="280" height="280" fill="#FEFEFE" stroke="#C8102E" stroke-width="2"/>
    <text x="376" y="180" font-family="Consolas, monospace" font-size="14" fill="#C8102E">BLOCK</text>
    <text x="376" y="230" font-size="26" font-weight="600" fill="#1E1E1E">Red</text>
    <text x="376" y="270" font-size="16" fill="#6B6B6B">Last weigh found</text>
    <text x="376" y="296" font-size="16" fill="#6B6B6B">differing records.</text>
    <text x="376" y="350" font-family="Consolas, monospace" font-size="15" fill="#C8102E">hook exit 2</text>
    <text x="376" y="382" font-size="15" fill="#6B6B6B">e.g. 408 of 408</text>

    <rect x="664" y="140" width="280" height="280" fill="#FEFEFE" stroke="#C8102E" stroke-width="2"/>
    <text x="684" y="180" font-family="Consolas, monospace" font-size="14" fill="#C8102E">BLOCK</text>
    <text x="684" y="230" font-size="26" font-weight="600" fill="#1E1E1E">Stale edit</text>
    <text x="684" y="270" font-size="16" fill="#6B6B6B">Port changed after</text>
    <text x="684" y="296" font-size="16" fill="#6B6B6B">the last weigh.</text>
    <text x="684" y="350" font-family="Consolas, monospace" font-size="15" fill="#C8102E">hook exit 2</text>
    <text x="684" y="382" font-size="15" fill="#6B6B6B">Weigh it again</text>

    <rect x="972" y="140" width="260" height="280" fill="#1E1E1E"/>
    <text x="992" y="180" font-family="Consolas, monospace" font-size="14" fill="#8FCB8F">ALLOW</text>
    <text x="992" y="230" font-size="26" font-weight="600" fill="#FEFEFE">Balanced</text>
    <text x="992" y="270" font-size="16" fill="#B0B0B0">Every record matches</text>
    <text x="992" y="296" font-size="16" fill="#B0B0B0">and sources unchanged.</text>
    <text x="992" y="350" font-family="Consolas, monospace" font-size="15" fill="#8FCB8F">hook exit 0</text>
    <text x="992" y="382" font-size="15" fill="#B0B0B0">Commit may proceed</text>
  </g>
  <text x="48" y="470" font-family="Consolas, monospace" font-size="15" fill="#6B6B6B">Also blocked: recorded-output only when sources differ from HEAD | protected paths dirty | every case the commit touches</text>
</svg>
