<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d">
  <title id="t">What people check first, and what that misses</title>
  <desc id="d">The published Java port passes 4 of 4 built-property tests and still differs on 408 of 408 Ain commune records.</desc>
  <rect width="1280" height="600" fill="#FEFEFE"/>
  <text x="48" y="52" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="0.12em" fill="#6B6B6B">THE CATCH</text>
  <text x="48" y="102" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#1E1E1E">Its own tests pass. The answer key does not.</text>

  <rect x="48" y="148" width="568" height="392" fill="#F3F3F3"/>
  <text x="80" y="200" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="0.1em" fill="#6B6B6B">WHAT PEOPLE CHECK FIRST</text>
  <text x="80" y="292" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#1E1E1E">4 of 4</text>
  <text x="80" y="348" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#1E1E1E">built-property unit tests pass</text>
  <text x="80" y="400" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B6B6B">Plus code review of the port.</text>
  <text x="80" y="432" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B6B6B">The agent that wrote the port also wrote</text>
  <text x="80" y="460" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B6B6B">the checks that judge it.</text>
  <text x="80" y="510" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1E1E1E">VERDICT: LOOKS FINE</text>

  <rect x="664" y="148" width="568" height="392" fill="#FEFEFE" stroke="#C8102E" stroke-width="4"/>
  <text x="696" y="200" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="0.1em" fill="#C8102E">WHAT THE ORIGINAL PROGRAM SAYS</text>
  <text x="696" y="292" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#C8102E">408 of 408</text>
  <text x="696" y="348" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#1E1E1E">Ain commune records differ</text>
  <text x="696" y="400" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B6B6B">Nationally: 35,268 of 35,389.</text>
  <text x="696" y="432" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B6B6B">Same 2018 inputs. Same layouts.</text>
  <text x="696" y="460" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B6B6B">Two defects the unit tests never saw.</text>
  <text x="696" y="510" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#C8102E">VERDICT: RED — DO NOT COMMIT</text>
</svg>
