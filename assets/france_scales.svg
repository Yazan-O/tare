<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="t d">
  <title id="t">France property tax - published port vs repaired</title>
  <desc id="d">National weigh: 35,268 of 35,389 red on the published AI port; 0 after repair. Commune records, not household bills.</desc>
  <rect width="1280" height="480" fill="#FEFEFE"/>
  <text x="48" y="44" font-family="Consolas, monospace" font-size="15" letter-spacing="0.08em" fill="#6B6B6B">FRANCE  |  TAXE FONCIERE 2018  |  COMMUNE RECORDS</text>
  <text x="48" y="86" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#1E1E1E">Published port vs repaired port, same answer key.</text>

  <!-- BEFORE -->
  <rect x="48" y="120" width="560" height="280" fill="#F7F7F7" stroke="#DEDEDE"/>
  <text x="72" y="156" font-family="Consolas, monospace" font-size="14" fill="#C8102E">BEFORE</text>
  <g transform="translate(180,175)">
    <line x1="40" y1="20" x2="220" y2="20" stroke="#1E1E1E" stroke-width="3"/>
    <line x1="130" y1="20" x2="130" y2="70" stroke="#1E1E1E" stroke-width="3"/>
    <line x1="40" y1="70" x2="220" y2="120" stroke="#1E1E1E" stroke-width="3"/>
    <rect x="20" y="68" width="80" height="40" fill="#FEFEFE" stroke="#1E1E1E" stroke-width="2"/>
    <rect x="180" y="118" width="80" height="40" fill="#C8102E" stroke="#1E1E1E" stroke-width="2"/>
    <text x="60" y="94" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1E1E1E">COBOL</text>
    <text x="220" y="144" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#FEFEFE">PORT</text>
  </g>
  <text x="72" y="360" font-family="Consolas, monospace" font-size="22" font-weight="600" fill="#C8102E">35,268 of 35,389 differ</text>

  <!-- AFTER -->
  <rect x="672" y="120" width="560" height="280" fill="#F7F7F7" stroke="#DEDEDE"/>
  <text x="696" y="156" font-family="Consolas, monospace" font-size="14" fill="#1E1E1E">AFTER</text>
  <g transform="translate(804,175)">
    <line x1="40" y1="70" x2="220" y2="70" stroke="#1E1E1E" stroke-width="3"/>
    <line x1="130" y1="20" x2="130" y2="70" stroke="#1E1E1E" stroke-width="3"/>
    <line x1="40" y1="70" x2="220" y2="70" stroke="#1E1E1E" stroke-width="3"/>
    <rect x="20" y="88" width="80" height="40" fill="#FEFEFE" stroke="#1E1E1E" stroke-width="2"/>
    <rect x="180" y="88" width="80" height="40" fill="#FEFEFE" stroke="#1E1E1E" stroke-width="2"/>
    <text x="60" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1E1E1E">COBOL</text>
    <text x="220" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1E1E1E">PORT</text>
  </g>
  <text x="696" y="360" font-family="Consolas, monospace" font-size="22" font-weight="600" fill="#1E1E1E">0 of 35,389 differ</text>

  <text x="48" y="440" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B6B6B">Commune 01001 total due: COBOL 137,415 EUR  |  published port 144,041 EUR. Replay differences on commune statistics, not a household loss.</text>
</svg>
