<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
  <title id="t">How Tare works</title>
  <desc id="d">Replay the COBOL, run the port, weigh every field, explain differences, gate the commit.</desc>
  <rect width="1280" height="460" fill="#FEFEFE"/>
  <text x="48" y="48" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="0.12em" fill="#6B6B6B">HOW IT WORKS</text>
  <text x="48" y="96" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1E1E1E">Original program in, balanced commit out.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="148" width="196" height="210" fill="#F3F3F3" stroke="#1E1E1E" stroke-width="2"/>
    <text x="68" y="188" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6B6B6B">01</text>
    <text x="68" y="236" font-size="24" font-weight="700" fill="#1E1E1E">Replay</text>
    <text x="68" y="276" font-size="15" fill="#6B6B6B">GnuCOBOL runs</text>
    <text x="68" y="300" font-size="15" fill="#6B6B6B">the original job.</text>
    <text x="68" y="324" font-size="15" fill="#6B6B6B">Output is the key.</text>

    <path d="M254 253 L274 253" stroke="#1E1E1E" stroke-width="2.5"/>
    <path d="M266 245 L274 253 L266 261" fill="none" stroke="#1E1E1E" stroke-width="2.5"/>

    <rect x="284" y="148" width="196" height="210" fill="#F3F3F3" stroke="#1E1E1E" stroke-width="2"/>
    <text x="304" y="188" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6B6B6B">02</text>
    <text x="304" y="236" font-size="24" font-weight="700" fill="#1E1E1E">Run port</text>
    <text x="304" y="276" font-size="15" fill="#6B6B6B">Same inputs,</text>
    <text x="304" y="300" font-size="15" fill="#6B6B6B">sandbox only,</text>
    <text x="304" y="324" font-size="15" fill="#6B6B6B">same layouts.</text>

    <path d="M490 253 L510 253" stroke="#1E1E1E" stroke-width="2.5"/>
    <path d="M502 245 L510 253 L502 261" fill="none" stroke="#1E1E1E" stroke-width="2.5"/>

    <rect x="520" y="148" width="196" height="210" fill="#FEFEFE" stroke="#C8102E" stroke-width="3.5"/>
    <text x="540" y="188" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#C8102E">03</text>
    <text x="540" y="236" font-size="24" font-weight="700" fill="#1E1E1E">Weigh</text>
    <text x="540" y="276" font-size="15" fill="#6B6B6B">Every record,</text>
    <text x="540" y="300" font-size="15" fill="#6B6B6B">every field,</text>
    <text x="540" y="324" font-size="15" fill="#6B6B6B">ledger + scale.</text>

    <path d="M726 253 L746 253" stroke="#1E1E1E" stroke-width="2.5"/>
    <path d="M738 245 L746 253 L738 261" fill="none" stroke="#1E1E1E" stroke-width="2.5"/>

    <rect x="756" y="148" width="196" height="210" fill="#F3F3F3" stroke="#1E1E1E" stroke-width="2"/>
    <text x="776" y="188" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6B6B6B">04</text>
    <text x="776" y="236" font-size="24" font-weight="700" fill="#1E1E1E">Explain</text>
    <text x="776" y="276" font-size="15" fill="#6B6B6B">COBOL lines,</text>
    <text x="776" y="300" font-size="15" fill="#6B6B6B">COPY REPLACING,</text>
    <text x="776" y="324" font-size="15" fill="#6B6B6B">port cause.</text>

    <path d="M962 253 L982 253" stroke="#1E1E1E" stroke-width="2.5"/>
    <path d="M974 245 L982 253 L974 261" fill="none" stroke="#1E1E1E" stroke-width="2.5"/>

    <rect x="992" y="148" width="240" height="210" fill="#1E1E1E"/>
    <text x="1012" y="188" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#C8102E">05</text>
    <text x="1012" y="236" font-size="24" font-weight="700" fill="#FEFEFE">Gate</text>
    <text x="1012" y="276" font-size="15" fill="#B0B0B0">PreToolUse + git.</text>
    <text x="1012" y="300" font-size="15" fill="#B0B0B0">Red or stale:</text>
    <text x="1012" y="324" font-size="15" fill="#FEFEFE">no commit.</text>
  </g>
  <text x="48" y="412" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#6B6B6B">IBM Bob plugin: mode | MCP | skills | parallel subagents | hooks</text>
</svg>
