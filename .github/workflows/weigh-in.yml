name: weigh-in

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  weigh-in:
    name: Test suite and the self-test case
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnucobol
          cobc --version | head -1
          cobc --info | grep -i -E 'indexed|file handler' || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      # answer key (fresh GnuCOBOL run checked against the committed fixture), every declared side run and
      # weighed; exits non-zero unless every side gets tare.json's expected verdict
      - name: Reproduce
        working-directory: examples/unitsum
        run: python -m tare reproduce

      - name: Upload ledgers, scale images and port outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tare-weigh-in
          path: |
            examples/unitsum/.tare/
            examples/unitsum/work/runs/
          include-hidden-files: true
          if-no-files-found: warn
